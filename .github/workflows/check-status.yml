name: Check protoc precompiled status

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0

      - name: Build all targets
        run: bazel build //...

      - name: Check protoc status
        run: python3 scripts/check_protoc_status.py

      - name: Commit status changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update protoc precompiled status [skip ci]"
            git push
          fi
